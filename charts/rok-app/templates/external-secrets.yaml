{{- /* One ExternalSecret per workload that declares a secretName. Wave -1: after the
       SecretStore (-2), before the Deployment (0). */ -}}
{{- range $component, $workload := .Values.workloads }}
{{- if and $workload.enabled (hasKey $workload "secretName") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $workload.secretName }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "rok-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component | kebabcase }}
spec:
  refreshInterval: {{ required (printf "workloads.%s.externalSecret.refreshInterval is required" $component) $workload.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required (printf "workloads.%s.secretStore.name is required" $component) $workload.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ $workload.secretName }}
    creationPolicy: {{ required (printf "workloads.%s.externalSecret.creationPolicy is required" $component) $workload.externalSecret.creationPolicy }}
  dataFrom:
    - extract:
        key: {{ required (printf "workloads.%s.externalSecret.remoteKey is required" $component) $workload.externalSecret.remoteKey }}
{{- end }}
{{- end }}
