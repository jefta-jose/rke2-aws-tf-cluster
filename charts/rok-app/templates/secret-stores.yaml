{{- /* One namespaced SecretStore per workload that declares a secretName. Wave -2:
       created first so the ExternalSecret can reference it.

       The `auth` block is LAB-ONLY (secretStoreAuth.enabled). Real ROK omits it entirely
       and relies on the node's IAM role (IRSA) — secretless. In Floci there is no IAM
       identity, so ESO must present static creds from a Secret in THIS namespace. */ -}}
{{- range $component, $workload := .Values.workloads }}
{{- if and $workload.enabled (hasKey $workload "secretName") }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ required (printf "workloads.%s.secretStore.name is required" $component) $workload.secretStore.name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "rok-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component | kebabcase }}
spec:
  provider:
    aws:
      service: {{ required (printf "workloads.%s.secretStore.provider.aws.service is required" $component) $workload.secretStore.provider.aws.service }}
      region: {{ required (printf "workloads.%s.secretStore.provider.aws.region is required" $component) $workload.secretStore.provider.aws.region }}
      {{- if $.Values.secretStoreAuth.enabled }}
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: {{ $.Values.secretStoreAuth.secretName }}
            key: {{ $.Values.secretStoreAuth.accessKeyIDKey }}
          secretAccessKeySecretRef:
            name: {{ $.Values.secretStoreAuth.secretName }}
            key: {{ $.Values.secretStoreAuth.secretAccessKeyKey }}
      {{- end }}
{{- end }}
{{- end }}
