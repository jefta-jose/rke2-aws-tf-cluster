{{- /*
One host-less Ingress PER workload (named after the workload), not one shared "rock-app"
Ingress. With the one-Application-per-workload model, each app renders only its own
workload — a single shared Ingress name would make the frontend and backend apps fight
over the same object. Separate names (rock-frontend / rock-backend) let Traefik merge the
path rules cleanly. Host-less because Floci's ALB rewrites the Host header (see Phase 8.4).
*/ -}}
{{- range $component, $workload := .Values.workloads }}
{{- if and $workload.enabled (hasKey $workload "ingress") $workload.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $workload.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "rock-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component | kebabcase }}
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: {{ $workload.ingress.path }}
            pathType: {{ $workload.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $workload.name }}
                port:
                  number: {{ $workload.service.port }}
{{- end }}
{{- end }}
