{{- if .Values.externalSecret.enabled }}
# App-specific ExternalSecret (mirrors therok_v2 infra). References the
# cluster-scoped ClusterSecretStore bootstrapped in Phase 6 (k8s/eso-floci-store.yaml).
# ESO pulls every key from the Floci secret into a k8s Secret the backend consumes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rok-general-secret
  labels:
    app: rok-app
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: floci-secrets-manager
  target:
    name: rok-general-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: development-rok-general-secret
{{- end }}
