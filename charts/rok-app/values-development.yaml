# development overlay — only the per-env bits (mirrors becklar values-development.yaml):
# image repositories (our local registry) + the AWS Secrets Manager remoteKey per workload.
workloads:
  frontend:
    image:
      repository: 192.168.122.1:5000/rock-frontend
      tag: v001          # v2 adds the Phase 9.3 send-email form
  backend:
    image:
      repository: 192.168.122.1:5000/rock-backend
      tag: v001
    externalSecret:
      remoteKey: development-rock-general-secret
  mailer:
    image:
      repository: 192.168.122.1:5000/rock-mailer
      tag: v001
    externalSecret:
      remoteKey: development-rock-general-secret
