# rok-app — map-driven chart (mirrors becklar_messaging_workloads).
# Add a workload = add an entry under `workloads:`; the templates range over it,
# so no new template files are needed. Per-env image repos + remoteKeys live in
# values-<env>.yaml (see values-development.yaml).

imagePullSecrets: []            # ROK: [{ name: aws-registry }]; our local registry is open
nodeSelector: {}                # lab: single worker node; ROK pins node-role.kubernetes.io/worker
podAnnotations: {}
terminationGracePeriodSeconds: 30

# LAB-ONLY: the per-workload SecretStores need AWS creds because Floci isn't IRSA.
# Real ROK sets enabled: false — ESO authenticates via the node's IAM role (secretless),
# so the rendered SecretStore has NO auth block at all. This Secret is bootstrapped once
# into the release namespace (not in git — it's a credential). See commands.md.
secretStoreAuth:
  enabled: true
  secretName: floci-aws-creds
  accessKeyIDKey: access-key-id
  secretAccessKeyKey: secret-access-key

workloads:
  # ---- server: static frontend (no secret) ----
  frontend:
    enabled: true
    name: rok-frontend
    replicas: 1
    image:
      repository: ""            # set per-env in values-<env>.yaml
      tag: ""
      pullPolicy: IfNotPresent
    service:
      enabled: true
      port: 80
      targetPort: 80
    ingress:
      enabled: true
      path: /
      pathType: Prefix
    env: {}
    readinessProbe:
      httpGet: { path: /, port: 80 }
    livenessProbe:
      httpGet: { path: /, port: 80 }
    resources: {}

  # ---- server: API backend (secret via ESO -> SECRET_MESSAGE) ----
  backend:
    enabled: true
    name: rok-backend
    replicas: 1
    image:
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent
    service:
      enabled: true
      port: 8080
      targetPort: 8080
    ingress:
      enabled: true
      path: /api
      pathType: Prefix
    env:
      AWS_REGION: us-east-1
    # secret plumbing (present => ExternalSecret + SecretStore are rendered)
    secretName: rok-backend-secret
    secretStore:
      name: rok-backend-secret-store
      provider:
        aws:
          service: SecretsManager
          region: us-east-1
    externalSecret:
      refreshInterval: 1m
      creationPolicy: Owner
      remoteKey: ""              # set per-env (the AWS Secrets Manager key)
    secretEnv:
      SECRET_MESSAGE: SECRET_MESSAGE
    readinessProbe:
      httpGet: { path: /healthz, port: 8080 }
    livenessProbe:
      httpGet: { path: /healthz, port: 8080 }
    resources: {}

  # ---- worker: SQS consumer (no service/ingress) — Phase 9 flips enabled: true ----
  worker:
    enabled: false             # build+push the image and enable in Phase 9
    name: rok-worker
    replicas: 1
    image:
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent
    service:
      enabled: false
    ingress:
      enabled: false
    env:
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://192.168.122.1:4566   # Floci, reachable from pods via virbr0 gw
    secretName: rok-worker-secret
    secretStore:
      name: rok-worker-secret-store
      provider:
        aws:
          service: SecretsManager
          region: us-east-1
    externalSecret:
      refreshInterval: 1m
      creationPolicy: Owner
      remoteKey: ""
    secretEnv:
      SQS_QUEUE_URL: SQS_QUEUE_URL
    resources: {}

  # ---- server: mailer — POST /api/email -> SMTP to the in-cluster mailpit sink (Phase 9.2) ----
  # Ships disabled (like worker) so the frontend/backend apps stay clean; the mailer
  # Application flips it on.
  mailer:
    enabled: false
    name: rok-mailer
    replicas: 1
    image:
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent
    service:
      enabled: true
      port: 8080
      targetPort: 8080
    ingress:
      enabled: true
      path: /api/email          # more specific than backend's /api, so Traefik routes them apart
      pathType: Prefix
    env:
      AWS_REGION: us-east-1
    # SMTP host/port come from the shared general secret via ESO (same remoteKey as backend).
    # dataFrom pulls every key of development-rok-general-secret; secretEnv picks the two we use.
    secretName: rok-mailer-secret
    secretStore:
      name: rok-mailer-secret-store
      provider:
        aws:
          service: SecretsManager
          region: us-east-1
    externalSecret:
      refreshInterval: 1m
      creationPolicy: Owner
      remoteKey: ""             # set per-env (development-rok-general-secret)
    secretEnv:
      SMTP_HOST: Smtp__Host     # -> mailpit-smtp.mailhog
      SMTP_PORT: Smtp__Port     # -> 1025
    readinessProbe:
      httpGet: { path: /healthz, port: 8080 }
    livenessProbe:
      httpGet: { path: /healthz, port: 8080 }
    resources: {}
