# Host-less Ingress exposing Prometheus through the Traefik `prometheus` entrypoint (NodePort 30002 ->
# socat localhost:9090). This IS the AWS ALB :9090 listener. Synced by the `ingress` child app.
# Backend = Service "prometheus-server" :80 (the chart's default Service port, which targets the pod's
# :9090). The external 9090 is the Traefik `prometheus` entrypoint, NOT this backend port.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: prometheus
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-server
                port:
                  number: 80
