# Turns the plain files in this folder into labelled ConfigMaps (PLAN Phase 10). The Grafana sidecars
# (enabled in k8s/applications/grafana.yaml) watch for the labels and load the content.
#   grafana_dashboard: "1"  -> dashboard sidecar;  annotation grafana_folder = Grafana folder name
#   grafana_alert: "1"      -> alert sidecar (contact points + alert rules)
# Hash suffixes are off so the ConfigMap names are stable (an edited file updates the same object).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: grafana-dashboard-nimbus-node-health
    files:
      - dashboards/nimbus-node-health.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Nimbus
  - name: grafana-alerts-nimbus
    files:
      - alerting/nimbus-alerting.yaml
    options:
      labels:
        grafana_alert: "1"
