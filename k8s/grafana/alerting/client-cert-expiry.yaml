# Client-certificate expiry alerts (PLAN Phase 10.4) -- the lab version of DD-1462: three severities on the
# same signal, escalating repeat intervals (24h / 4h / 1h), all routed to the shared contact point.
#
# Signal: apiserver_client_certificate_expiration_seconds (histogram of the lifetime left on every client cert
# presented to the API server -- kubelets, kube-proxy, admin kubeconfigs...). The `le` bucket "<= N seconds" counts
# certs that expire within N seconds, so an INCREASE over 1h in that bucket > 0 means "something with a cert
# this close to expiry just authenticated".
#   * Query is a plain sum(increase()) -- NO `> 0` filter inside PromQL and NO `or vector(0)`: a healthy cluster
#     returns 0, and a vanished metric returns nothing = real No data = Alerting. The Threshold (> 0) does the
#     firing, in Grafana.
#   * `le` label strings are Prometheus' own float formatting ("7.776e+06", "2.592e+06", "604800.0"); a
#     near-miss like "7776000" matches NOTHING and the rule would silently never fire.
apiVersion: 1

groups:
  - orgId: 1
    name: Nimbus Client Cert Expiry
    folder: Nimbus
    interval: 1m
    rules:
      - uid: nimbus-client-cert-warning
        title: Client cert expires < 90d (warning)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(increase(apiserver_client_certificate_expiration_seconds_bucket{le="7.776e+06"}[1h]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        labels:
          severity: warning
          cluster: nimbus
        annotations:
          summary: "Warning: a client certificate seen by the API server expires in under 90 days. Runbook: PLAN.md Phase 12 (restart RKE2 to regenerate)."
          description: "Increase of API-server client certs with < 90d left over the last hour is {{ $values.B.Value }}. Note an OLD admin kubeconfig can also trigger this, not just node certs."
        notification_settings:
          receiver: nimbus-teams
          repeat_interval: 24h
      - uid: nimbus-client-cert-critical
        title: Client cert expires < 30d (critical)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(increase(apiserver_client_certificate_expiration_seconds_bucket{le="2.592e+06"}[1h]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        labels:
          severity: critical
          cluster: nimbus
        annotations:
          summary: "Critical: a client certificate seen by the API server expires in under 30 days. Runbook: PLAN.md Phase 12 (restart RKE2 to regenerate)."
          description: "Increase of API-server client certs with < 30d left over the last hour is {{ $values.B.Value }}. Note an OLD admin kubeconfig can also trigger this, not just node certs."
        notification_settings:
          receiver: nimbus-teams
          repeat_interval: 4h
      - uid: nimbus-client-cert-emergency
        title: Client cert expires < 7d (emergency)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(increase(apiserver_client_certificate_expiration_seconds_bucket{le="604800.0"}[1h]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        labels:
          severity: emergency
          cluster: nimbus
        annotations:
          summary: "EMERGENCY: a client certificate seen by the API server expires in under 7 days. Runbook: PLAN.md Phase 12 (restart RKE2 to regenerate)."
          description: "Increase of API-server client certs with < 7d left over the last hour is {{ $values.B.Value }}. Note an OLD admin kubeconfig can also trigger this, not just node certs."
        notification_settings:
          receiver: nimbus-teams
          repeat_interval: 1h
