# ===>
# Secret object that stores aws creds needed to read secret manager
# ===>
apiVersion: v1
kind: Secret
metadata:
  name: floci-aws-creds
  namespace: external-secrets
type: Opaque
stringData:
  access-key-id: "test"
  secret-access-key: "test"
# NOTE: the app-specific ExternalSecret (rok-general-secret) moved into the
# rok-app Helm chart (charts/rok-app) so ArgoCD owns it. This file now holds only
# the cluster-scoped ESO bootstrap: the AWS creds Secret + the ClusterSecretStore.
---
# ===>
# pulls creds from the secret object and uses them to read secret manager
# ===>
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: floci-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: floci-aws-creds
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: floci-aws-creds
            namespace: external-secrets
            key: secret-access-key

