# Host-less Ingress exposing Prometheus through the Traefik `prometheus` entrypoint (NodePort 30002 ->
# socat localhost:9090). This IS the AWS ALB :9090 listener. Synced by the monitoring-ingress child app.
# Backend = Service "prometheus-server" :9090 (set via server.service.servicePort in the prometheus
# child app, overriding the chart's default :80) so the whole chain is 9090 end to end.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: prometheus
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-server
                port:
                  number: 80
