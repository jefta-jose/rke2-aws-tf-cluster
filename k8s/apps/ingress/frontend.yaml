# Host-less Ingress exposing the frontend through the Traefik `web` entrypoint (NodePort 30001 ->
# socat localhost:8080). This IS the AWS ALB :80 listener. Lives OUTSIDE charts/nimbus-app on
# purpose (repo convention: charts render workloads, Ingress glue lives in an ingress/ dir and is
# synced by its own git-directory Application — see k8s/monitoring/ingress + monitoring-ingress).
# Backend = the frontend Service :8080 (nginx). All /api/* fan-out happens inside nginx, so only the
# frontend is exposed; service-a/service-b stay ClusterIP-internal.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
