# Owns ONLY the backend (Deployment + Service + Ingress /api + SecretStore + ExternalSecret).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rock-backend-development
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jefta-jose/rke2-aws-tf-cluster.git
    targetRevision: main
    path: charts/rock-app
    helm:
      releaseName: rock-backend-development
      valueFiles:
        - values-development.yaml
      parameters:
        - name: workloads.frontend.enabled
          value: "false"
        - name: workloads.worker.enabled
          value: "false"
        - name: workloads.mailer.enabled
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: rock-development
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
