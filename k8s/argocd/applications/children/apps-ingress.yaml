# Raw host-less Ingress for the app tier (the frontend on the Traefik `web` entrypoint). A plain
# git-directory Application syncing k8s/apps/ingress/ — same convention as monitoring-ingress: the
# nimbus-app chart renders workloads only, every Traefik Ingress lives in an ingress/ dir with the
# one known-good host-less pattern (entrypoint annotation + path, no Host header). Drop a new
# Ingress YAML into k8s/apps/ingress/ to expose another app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-ingress
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jefta-jose/rke2-aws-tf-cluster.git
    targetRevision: main
    path: k8s/apps/ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
