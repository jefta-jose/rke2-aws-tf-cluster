# Raw host-less Ingresses for the monitoring stack (Loki + Prometheus). A plain git-directory
# Application — syncs every manifest under k8s/monitoring/ingress/ to the in-cluster cluster, ns monitoring.
# CONVENTION: Helm chart apps render ONLY their workload; the Traefik Ingress that exposes each service
# lives here as a plain manifest, so all the "ingress glue" is in one place with one known-good host-less
# pattern (entrypoint + path, no Host header) instead of each chart's ingress quirks. Add a service's
# entrypoint by dropping its Ingress YAML into k8s/monitoring/ingress/ — this app picks it up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-ingress
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jefta-jose/rke2-aws-tf-cluster.git
    targetRevision: main
    path: k8s/monitoring/ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
