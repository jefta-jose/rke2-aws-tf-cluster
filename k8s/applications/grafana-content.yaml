# Grafana CONTENT from git (PLAN Phase 10): dashboards + alerting ConfigMaps built by kustomize from
# k8s/grafana/. The Grafana sidecars (see grafana.yaml) pick them up. Separate from the `grafana` app so
# content changes never re-render the chart / restart Grafana. Delete a file in git -> it disappears
# from Grafana (prune).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-content
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jefta-jose/rke2-aws-tf-cluster.git
    targetRevision: main
    path: k8s/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true      # big dashboard JSON can exceed the 256KB client-side-apply annotation limit
