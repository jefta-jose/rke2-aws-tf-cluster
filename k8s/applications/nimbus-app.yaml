# nimbus-app (our React + service-a + service-b workloads), managed by ArgoCD via the app-of-apps.
# PLAN Phase 9.2/9.3. Unlike prometheus/loki (remote Helm repos), this chart lives IN our git repo
# at charts/nimbus-app — ArgoCD renders it with `helm template` from that path on every sync. So the
# GitOps loop is: edit chart/values -> commit + push -> ArgoCD re-renders and applies. Images are
# pulled by the nodes from the host registry (192.168.122.1:5000/nimbus/...), already pushed.
#
# Destination ns `default` — single-ns lab (matches the 9.6 anti-affinity note). The frontend's
# nginx FQDNs (service-a.default.svc...) and the Ingress backend both assume this namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nimbus-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jefta-jose/rke2-aws-tf-cluster.git
    targetRevision: main
    path: charts/nimbus-app
    helm:
      releaseName: nimbus-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
