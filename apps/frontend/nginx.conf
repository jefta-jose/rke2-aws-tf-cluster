# Full nginx config for the nginx-unprivileged image (runs as uid 101, listens on 8080).
# Serves the React static build and reverse-proxies /api/<service>/* to the in-cluster Services.
#
# resolver + variable in proxy_pass => nginx resolves the backend name PER REQUEST via CoreDNS
# (10.43.0.10) instead of once at startup. So the frontend boots fine even if service-a/service-b
# are not up yet, and picks them up as soon as they are (no crashloop, no stale IP).
worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # writable temp paths for the non-root user
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  server {
    listen 8080;
    resolver 10.43.0.10 valid=10s ipv6=off;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve the file if it exists, otherwise fall back to index.html
    location / {
      try_files $uri /index.html;
    }

    # trailing slash on both location and proxy_pass => /api/service-a/visit -> /visit on service-a
    location /api/service-a/ {
      set $svc_a service-a.default.svc.cluster.local;
      proxy_pass http://$svc_a:8080/;
    }
    location /api/service-b/ {
      set $svc_b service-b.default.svc.cluster.local;
      proxy_pass http://$svc_b:8080/;
    }
  }
}
