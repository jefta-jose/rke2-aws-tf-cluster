# Grafana on the WSL host (PLAN Phase 8) — OUTSIDE the cluster, reading Prometheus + Loki through the
# socat "ALB". Published on :3000 with a normal bridge mapping (same pattern as registry/).
#
# Do NOT use network_mode: host here: with Docker Desktop the container shares the Docker VM's network,
# not the WSL host's, so :3000 never appears on the WSL host. We publish the port instead, and reach the
# host's socat forwards via host.docker.internal (the container's own localhost is the container).
services:
  grafana:
    image: grafana/grafana:latest
    container_name: nimbus-grafana
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - nimbus-grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  nimbus-grafana-data:
