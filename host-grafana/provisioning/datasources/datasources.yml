# Provisioned datasources — both read through the socat "ALB" on the host (Phase 4/7). The container
# reaches the host via host.docker.internal (its own localhost is the container, not the host).
# access: proxy means Grafana's backend makes the call.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://host.docker.internal:9090
    isDefault: true
  - name: Loki
    type: loki
    access: proxy
    url: http://host.docker.internal:3100
