# File-based dashboard provider: any *.json dropped into this directory is loaded into a "Nimbus"
# folder on startup. (Import by ID in the UI also works, e.g. 1860 node-exporter, 3662 Prometheus stats.)
apiVersion: 1
providers:
  - name: nimbus
    orgId: 1
    folder: Nimbus
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards
