# Lima config for the RKE2 server (control-plane + etcd) node.
# `base` inherits Lima's default Ubuntu image/settings; we override size and add
# the user-v2 shared network so the agent VM (Phase 4) can reach us on :9345.
base: template://default

vmType: qemu
cpus: 2
memory: "3GiB"
disk: "20GiB"

# eth0 (from base) = user-mode NAT → internet.
# lima0 = user-v2 shared network → VM-to-VM (server <-> agent on 9345/6443).
networks:
  - lima: user-v2

# No host mounts needed; we drive the VM over `limactl shell`.
mounts: []
